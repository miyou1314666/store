<!doctype html>
<html lang="zh-CN" class="notranslate" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>车架散件储备清单自动生成</title>
    <link rel="stylesheet" href="/style.css?v=20260723l" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <p class="eyebrow">SAP 用量表 + SRM 预测表</p>
          <h1>车架散件储备清单自动生成</h1>
          <p class="lead">拖入两张导出表，系统自动识别横梁和小件，按每个月用量是否达标与下月预测需求筛选图号，并输出下个月储备数量 Excel。</p>
        </div>
        <aside id="ruleCard" class="rule-card notranslate" aria-label="当前规则" translate="no">
          <h2>当前规则</h2>
          <textarea id="ruleText" readonly tabindex="-1">横梁：名称含“横梁”且图号含 T。
小件：图号不含 T。
筛选：三个自然月每月用量均超过对应阈值，且 N+1 需求大于 0。
计算：三个月平均用量 × 对应储备比例。</textarea>
        </aside>
      </section>

      <form id="toolForm" class="panel">
        <div class="drop-grid">
          <label class="drop-zone" data-zone="sap">
            <input id="sapFile" name="sapFile" type="file" accept=".xlsx,.xls,.csv" required />
            <b>SAP 前三个月用量表</b>
            <span>字段需包含：物料、物料描述、需求日期、需求量、供应商</span>
            <em id="sapName">拖拽文件到这里，或点击选择</em>
          </label>

          <label class="drop-zone" data-zone="srm">
            <input id="srmFile" name="srmFile" type="file" accept=".xlsx,.xls,.csv" required />
            <b>SRM 未来预测表</b>
            <span>字段需包含：计划年份、计划月份、供应商编号、零件编码、N+1总数</span>
            <em id="srmName">拖拽文件到这里，或点击选择</em>
          </label>
        </div>

        <div class="settings">
          <label>
            <span>横梁每月用量阈值</span>
            <input name="crossbeamThreshold" type="number" min="0" step="1" value="20" />
          </label>
          <label>
            <span>小件每月用量阈值</span>
            <input name="smallThreshold" type="number" min="0" step="1" value="30" />
          </label>
          <label>
            <span>横梁储备比例</span>
            <input name="crossbeamReserveRate" type="number" min="0" step="1" value="30" />
          </label>
          <label>
            <span>小件储备比例</span>
            <input name="smallReserveRate" type="number" min="0" step="1" value="30" />
          </label>
          <button class="primary" type="submit">生成储备清单</button>
        </div>
      </form>

      <section id="resultPanel" class="panel results hidden notranslate" translate="no">
        <div class="result-head">
          <div>
            <h2>输出结果</h2>
            <p id="resultMeta">结果会分为横梁和小件两个板块，并生成可下载的 Excel 文件。</p>
          </div>
          <a id="downloadLink" class="download notranslate" href="#" download translate="no">下载 Excel 清单</a>
        </div>

        <div class="stats">
          <div><strong id="crossbeamCount">0</strong><span>横梁图号</span></div>
          <div><strong id="smallCount">0</strong><span>小件图号</span></div>
          <div><strong id="reserveQty">0</strong><span>储备总数量</span></div>
          <div><strong id="targetMonth">-</strong><span>输出月份</span></div>
        </div>

        <div class="section-title">
          <h3>横梁储备清单 <span id="crossbeamShown"></span></h3>
        </div>
        <div class="table-wrap">
          <table id="crossbeamTable">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>

        <div class="section-title">
          <h3>小件储备清单 <span id="smallShown"></span></h3>
        </div>
        <div class="table-wrap">
          <table id="smallTable">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="/app.js?v=20260723l"></script>
  </body>
</html>
